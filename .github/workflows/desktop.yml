# Gera o app de desktop num Mac e num Windows de verdade (na nuvem do GitHub).
# Os instaladores ficam em "Releases" → "SOBEDESCE · versão de teste". Uma tag v* (ex.: v0.1.0) também publica um Release.
# Em branches que não são a main, o app só é gerado quando a mensagem do commit tem [build]
# (o Mac na nuvem consome os minutos gratuitos do GitHub 10× mais rápido).
name: App de desktop

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes do motor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fast

  app:
    name: App (${{ matrix.label }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Mac
            build: npm run dist:mac
            files: dist/*.dmg
          - os: windows-latest
            label: Windows
            build: npm run dist:win
            files: dist/*.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Identidade do build (src/build-info.json vai dentro do app): o aviso "Nova versão do SOBEDESCE" compara com ela.
      - run: node scripts/build-info.mjs
      - run: ${{ matrix.build }}
      # Os instaladores vão para um Release de teste ("SOBEDESCE · versão de teste"): Releases não usam
      # a cota de armazenamento de artefatos do Actions, que é pequena e enche rápido.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: versao-de-teste
          name: SOBEDESCE · versão de teste
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
          body: Instaladores gerados automaticamente a partir do último commit com [build]. Sem assinatura da Apple/Microsoft por enquanto (veja o README).

  # Só depois dos DOIS instaladores no Release (needs espera o Mac e o Windows; se um falhar, este não roda):
  # sobe o versao.json que o site serve em /baixar/versao e que faz o app mostrar "Nova versão do SOBEDESCE".
  versao:
    name: Avisar versão nova
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-info.mjs versao.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: versao-de-teste
          name: SOBEDESCE · versão de teste
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: versao.json
          fail_on_unmatched_files: true
          body: Instaladores gerados automaticamente a partir do último commit com [build]. Sem assinatura da Apple/Microsoft por enquanto (veja o README).

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
