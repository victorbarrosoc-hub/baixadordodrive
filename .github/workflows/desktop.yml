# Gera o app de desktop num Mac e num Windows de verdade (na nuvem do GitHub).
# Os instaladores ficam em "Releases" → "SOBEDESCE · versão de teste". Uma tag v* (ex.: v0.1.0) também publica um Release.
# Em branches que não são a main, o app só é gerado quando a mensagem do commit tem [build] (e fica como artefato, fora do Release)
# (o Mac na nuvem consome os minutos gratuitos do GitHub 10× mais rápido). Pull requests para a main também geram o app
# e rodam o teste de fumaça (sem publicar nada), a não ser que só mexam no site, na documentação ou em textos .md.
name: App de desktop

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Só leitura por padrão (revisão de segurança, A8). Escrita só nos jobs que publicam no Release (app, versao e release).
# As actions de fora vão fixadas pelo SHA do commit, com a tag ao lado: uma tag movida não troca o código que roda aqui.
# Passo a passo do lado do GitHub (main protegida, 2FA, quem roda workflows): docs/SEGURANCA-GITHUB.md.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes do motor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Ninguém aqui faz git push: o token não fica gravado no .git/config ao alcance do npm ci e dos scripts.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fast

  app:
    name: App (${{ matrix.label }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Escrita para subir os instaladores no Release "versao-de-teste" (só a main publica, pelos if dos passos).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Mac
            plataforma: mac
            build: npm run dist:mac
            files: dist/*.dmg
          - os: windows-latest
            label: Windows
            plataforma: windows
            build: npm run dist:win
            files: dist/*.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Em pull request o electron-builder pula a assinatura; a do Mac aqui é ad-hoc (identity "-", sem certificado nem
      # segredo), então assina igual à main: sem ela o framework da Blackmagic dentro do app fica com a assinatura
      # quebrada, o macOS não carrega e o teste de fumaça do PR não testaria o app que sai de verdade.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Ninguém aqui faz git push: o token não fica gravado no .git/config ao alcance do npm ci e dos scripts.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Identidade do build (src/build-info.json vai dentro do app): o aviso "Nova versão do SOBEDESCE" compara com ela.
      - run: node scripts/build-info.mjs
      # yt-dlp das Referências (versão fixa, conferida pelo SHA-256 do Release) em build/yt-dlp/; o electron-builder põe
      # em Resources/yt-dlp. Depois de instalado, o app mantém o yt-dlp em dia sozinho (src/referencias/ytdlp-update.js).
      - run: node scripts/ytdlp-baixar.mjs
      # ffmpeg da prévia leve (versões fixas, conferidas por SHA-256) em build/ffmpeg/; o electron-builder põe em Resources/ffmpeg.
      - run: node scripts/ffmpeg-baixar.mjs
      # QuickJS-ng (versão fixa, SHA-256) em build/quickjs/: o JavaScript dos desafios do YouTube para o yt-dlp, já que o
      # fusível RunAsNode desligado não deixa mais usar o próprio Electron como Node.
      - run: node scripts/quickjs-baixar.mjs
      # Decodificador de Blackmagic RAW (proxy e miniatura de .braw) em build/raw-frame/: baixa o SDK da Blackmagic com o
      # cadastro do segredo BRAW_SDK_CADASTRO (o SDK não pode ficar no repositório), compila e testa no sample.braw do
      # SDK. Sem o segredo (fork), o passo não faz nada e o app sai sem ele.
      - run: node scripts/raw-frame-build.mjs
        env:
          BRAW_SDK_CADASTRO: ${{ secrets.BRAW_SDK_CADASTRO }}
      - run: ${{ matrix.build }}
      # Teste de fumaça do app empacotado (desktop/smoke.js): abre o app de verdade com --smoke, sobe o motor (código no
      # app.asar, worker do MD5, interface), roda ffmpeg, yt-dlp e QuickJS de dentro do app, cifra e decifra no cofre do
      # sistema, escreve "SMOKE OK" e sai com 0. Qualquer outra coisa falha o job antes de publicar (os passos de
      # publicar vêm depois). Também mostra os fusíveis gravados no executável.
      # Mac: um Keychain temporário e destravado evita a janela de senha no CI; se o cofre mesmo assim não responder,
      # o teste marca AVISO (só o Windows exige o cofre).
      - if: matrix.plataforma == 'mac'
        name: Teste de fumaça (Mac)
        timeout-minutes: 8
        run: |
          security create-keychain -p smoke smoke.keychain-db || true
          security set-keychain-settings smoke.keychain-db || true
          security unlock-keychain -p smoke smoke.keychain-db || true
          security list-keychains -d user -s smoke.keychain-db || true
          security default-keychain -d user -s smoke.keychain-db || true
          npx --no-install electron-fuses read --app dist/mac-universal/SOBEDESCE.app
          export SOBEDESCE_SMOKE_SAIDA="$RUNNER_TEMP/smoke.txt"
          code=0
          dist/mac-universal/SOBEDESCE.app/Contents/MacOS/SOBEDESCE --smoke || code=$?
          echo "--- resultado (saída $code) ---"
          cat "$SOBEDESCE_SMOKE_SAIDA" || true
          test "$code" -eq 0
          grep -q '^SMOKE OK$' "$SOBEDESCE_SMOKE_SAIDA"
      - if: matrix.plataforma == 'windows'
        name: Teste de fumaça (Windows)
        timeout-minutes: 8
        shell: pwsh
        run: |
          npx --no-install electron-fuses read --app dist/win-unpacked/SOBEDESCE.exe
          $env:SOBEDESCE_SMOKE_SAIDA = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process -FilePath 'dist\win-unpacked\SOBEDESCE.exe' -ArgumentList '--smoke' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill($true); Write-Error 'o teste de fumaça passou de 5 minutos'; exit 1 }
          Write-Output "--- resultado (saída $($p.ExitCode)) ---"
          Get-Content $env:SOBEDESCE_SMOKE_SAIDA -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path $env:SOBEDESCE_SMOKE_SAIDA -Pattern '^SMOKE OK$' -Quiet)) { exit 1 }
      # SHA-256 do instalador (main): o job "versao" junta os dois no versao.json. O app ("Atualizar") e os
      # instaladores de uma linha do site (/instalar.sh e /instalar.ps1) só instalam se o download bater com ele.
      # Nome com o build (SOBEDESCE-0.1.0-b160-…): o build seguinte não troca este arquivo no Release, então o
      # SHA-256 do versao.json sempre bate com o instalador que o site entrega (scripts/nome-instalador.mjs).
      - if: github.ref == 'refs/heads/main'
        run: node scripts/nome-instalador.mjs ${{ matrix.plataforma }} dist
      - if: github.ref == 'refs/heads/main'
        run: node scripts/sha256.mjs ${{ matrix.plataforma }} dist sha256
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256-${{ matrix.plataforma }}
          path: sha256/
          retention-days: 1
          if-no-files-found: error
      # Os instaladores vão para um Release de teste ("SOBEDESCE · versão de teste"): Releases não usam
      # a cota de armazenamento de artefatos do Actions, que é pequena e enche rápido.
      # Só a main publica ali: é para lá que o aviso "Nova versão" e o /baixar do site mandam as pessoas.
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: versao-de-teste
          name: SOBEDESCE · versão de teste
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
          body: Instaladores gerados automaticamente a partir do último commit da main. Sem assinatura da Apple/Microsoft por enquanto (veja o README).
      # Branches com [build] e tags v*: os instaladores ficam como artefato do Actions (por poucos dias); a tag
      # publica o próprio Release no job "release".
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-${{ matrix.label }}
          path: ${{ matrix.files }}
          retention-days: 5
          if-no-files-found: error

  # Só depois dos DOIS instaladores no Release (needs espera o Mac e o Windows; se um falhar, este não roda):
  # sobe o versao.json que o site serve em /baixar/versao e que faz o app mostrar "Nova versão do SOBEDESCE",
  # com o SHA-256 de cada instalador (sha256Mac/sha256Windows).
  versao:
    name: Avisar versão nova
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Ninguém aqui faz git push: o token não fica gravado no .git/config ao alcance do npm ci e dos scripts.
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sha256-*
          path: sha256
          merge-multiple: true
      - run: node scripts/build-info.mjs versao.json --sha256 sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: versao-de-teste
          name: SOBEDESCE · versão de teste
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: versao.json
          fail_on_unmatched_files: true
          body: Instaladores gerados automaticamente a partir do último commit da main. Sem assinatura da Apple/Microsoft por enquanto (veja o README).
      # Instaladores de builds antigos saem do Release (ficam o atual e os dois anteriores; scripts/limpar-release.mjs).
      - run: node scripts/limpar-release.mjs ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: instaladores/*
          generate_release_notes: true
